<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Rolador de dados">
  <meta name="theme-color" content="#07060b">

  <title>Rolador de Dados</title>

  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦇</text></svg>">
  <link rel="stylesheet" href="style.css?v=6">
</head>

<body>

  <!-- Atmospheric Background -->
  <div class="fog-layer" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <!-- App Layout: Two Columns -->
  <div class="app-layout">

    <!-- LEFT: Main content -->
    <main class="main-panel">

      <!-- Vampire Mode Toggle -->
      <section class="vampire-mode-bar" id="vampire-mode-bar">
        <div class="vampire-toggle-group">
          <label class="toggle-switch" for="vampire-toggle">
            <input type="checkbox" id="vampire-toggle">
            <span class="toggle-slider"></span>
          </label>
          <label for="vampire-toggle" class="vampire-toggle-label">Modo Vampiro</label>
        </div>
        <div class="difficulty-group hidden" id="difficulty-group">
          <span class="difficulty-label" id="difficulty-label">Dificuldade</span>
          <div class="difficulty-controls" role="spinbutton" aria-labelledby="difficulty-label" aria-valuenow="6" aria-valuemin="2" aria-valuemax="10">
            <button class="diff-btn" id="diff-down" type="button" aria-label="Diminuir dificuldade">−</button>
            <span class="difficulty-value" id="difficulty-value">6</span>
            <button class="diff-btn" id="diff-up" type="button" aria-label="Aumentar dificuldade">+</button>
          </div>
        </div>
      </section>

      <!-- Dice Selector -->
      <section class="section" id="dice-selector-section">
        <h1 class="section-title">Escolha seus dados</h1>
        <div class="dice-grid" id="dice-grid">
          <button class="dice-btn" data-die="d4" id="btn-d4" type="button" aria-label="Adicionar dado d4">
            <span class="dice-icon">◆</span>
            <span class="dice-label">d4</span>
          </button>
          <button class="dice-btn" data-die="d6" id="btn-d6" type="button" aria-label="Adicionar dado d6">
            <span class="dice-icon">⬡</span>
            <span class="dice-label">d6</span>
          </button>
          <button class="dice-btn" data-die="d8" id="btn-d8" type="button" aria-label="Adicionar dado d8">
            <span class="dice-icon">◈</span>
            <span class="dice-label">d8</span>
          </button>
          <button class="dice-btn" data-die="d10" id="btn-d10" type="button" aria-label="Adicionar dado d10">
            <span class="dice-icon">⬟</span>
            <span class="dice-label">d10</span>
          </button>
          <button class="dice-btn" data-die="d12" id="btn-d12" type="button" aria-label="Adicionar dado d12">
            <span class="dice-icon">⬠</span>
            <span class="dice-label">d12</span>
          </button>
          <button class="dice-btn" data-die="d20" id="btn-d20" type="button" aria-label="Adicionar dado d20">
            <span class="dice-icon">⏣</span>
            <span class="dice-label">d20</span>
          </button>
          <button class="dice-btn" data-die="d100" id="btn-d100" type="button" aria-label="Adicionar dado d100">
            <span class="dice-icon">◉</span>
            <span class="dice-label">d100</span>
          </button>
        </div>
      </section>

      <!-- Dice Pool -->
      <section class="section" id="pool-section">
        <div class="pool-header">
          <h2 class="section-title">Seus dados</h2>
          <button class="save-preset-btn hidden" id="save-preset-btn" type="button" title="Salvar como favorito">
            ★ Salvar
          </button>
        </div>
        <div class="dice-pool" id="dice-pool">
          <div class="dice-pool-empty" id="pool-empty">
            Toque em um dado acima para adicioná-lo
          </div>
        </div>
      </section>

      <!-- Preset Save Inline Input -->
      <div class="preset-save-inline hidden" id="preset-save-container">
        <input type="text" class="preset-name-input" id="preset-name-input" placeholder="Nome do favorito..." maxlength="30">
        <button class="preset-confirm-btn" id="preset-confirm-btn" type="button" title="Salvar">✓</button>
        <button class="preset-cancel-btn" id="preset-cancel-btn" type="button" title="Cancelar">✕</button>
      </div>

      <!-- Presets / Favorites -->
      <section class="section presets-section hidden" id="presets-section">
        <h2 class="section-title">Favoritos</h2>
        <div class="presets-list" id="presets-list"></div>
      </section>

      <!-- Roll Button -->
      <div class="roll-section">
        <button class="roll-btn" id="roll-btn" type="button" disabled>
          Rolar
        </button>
      </div>

      <!-- Results -->
      <section class="section results-section" id="results-section">
        <h2 class="section-title results-title hidden" id="results-title">Resultados</h2>
        <div class="results-grid" id="results-grid"></div>
        <!-- Vampire Mode summary (successes/failures) -->
        <div class="vampire-summary hidden" id="vampire-summary">
          <div class="vampire-summary-value" id="vampire-summary-value"></div>
          <div class="vampire-summary-detail" id="vampire-summary-detail"></div>
        </div>
      </section>

    </main>

    <!-- RIGHT: History panel -->
    <aside class="history-panel" id="history-panel">
      <div class="history-panel-header">
        <h2 class="section-title">Histórico</h2>
        <button class="history-clear hidden" id="history-clear" type="button">
          Limpar
        </button>
      </div>
      <div class="history-list" id="history-list">
        <div class="history-empty" id="history-empty">
          Nenhuma rolagem ainda
        </div>
      </div>

      <!-- Mobile toggle -->
      <button class="history-mobile-toggle" id="history-mobile-toggle" type="button" aria-label="Abrir histórico">
        <span class="toggle-icon">📜</span>
      </button>
    </aside>

  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(r => r.forEach(reg => reg.unregister()));
    }
  </script>
  <script src="app.js?v=3"></script>
</body>

</html>
